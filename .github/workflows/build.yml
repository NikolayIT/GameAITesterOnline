name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore src/OnlineGames.sln

      - name: Build
        run: msbuild src/OnlineGames.sln /m /v:m /p:Configuration=Release
